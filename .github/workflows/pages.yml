name: Build catalog and deploy

on:
  push:
    branches: [main]
  schedule:
    # GitHub cron uses UTC: 06:05 is 2:05 AM EDT / 1:05 AM EST.
    - cron: '5 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # Never let a code push cancel the autonomous catalog/artwork refresh.
  cancel-in-progress: false

jobs:
  deploy:
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install build dependencies
        run: npm ci
      - name: Run recognition regression gate
        run: npm test
      - name: Reuse current catalog for code deployment
        if: github.event_name == 'push'
        run: node reuse-deployed-catalog.mjs
      - name: Refresh universal TCG catalog
        if: github.event_name != 'push'
        shell: bash
        run: |
          for attempt in 1 2 3; do
            echo "Catalog refresh attempt ${attempt} of 3"
            if npm run catalog; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Catalog provider unavailable; waiting 15 minutes before the next automatic attempt."
              sleep 900
            fi
          done
          echo "Catalog refresh failed after 3 automatic attempts. The current production catalog was not replaced."
          exit 1
      - name: Build static site
        run: npm run build
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
