name: Build catalog and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '35 20 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Reuse current catalog for code deployment
        if: github.event_name == 'push'
        run: node reuse-deployed-catalog.mjs
      - name: Refresh universal TCG catalog
        if: github.event_name != 'push'
        run: npm run catalog
      - name: Build static site
        run: npm run build
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
